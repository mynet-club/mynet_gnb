name: Publish production packages to CTL
description: >
  把 .release/production 里的归档包（tgz，windows 为 zip）逐个 POST 到 ctl.mynet.club 的
  release 上传接口，也就是我方真正的下载面（/d/gnb/<文件名>）。
  download.mynet.club 已废弃，不再往它 rsync。
inputs:
  token:
    description: CTL 的 release:upload Bearer token（来自 secret）
    required: true
  base_url:
    description: CTL 站点基址
    required: false
    default: https://ctl.mynet.club
  dir:
    description: 待上传的生产包目录
    required: false
    default: .release/production

runs:
  using: composite
  steps:
    - name: Upload packages to CTL
      shell: bash
      env:
        CTL_TOKEN: ${{ inputs.token }}
        CTL_BASE: ${{ inputs.base_url }}
        SRC_DIR: ${{ inputs.dir }}
        REF_NAME: ${{ github.ref_name }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        set -euo pipefail
        shopt -s nullglob
        # 两种扩展名都要收：windows 按 ctl 的 windows 档出 .zip，其余 .tgz。
        PKGS=("$SRC_DIR"/*.tgz "$SRC_DIR"/*.zip)
        if [ ${#PKGS[@]} -eq 0 ]; then
          echo "本批没有生产通道归档包（internal/ 的开发包按设计不进下载面），跳过。"
          exit 0
        fi

        # 缺 token 必须红。上一版这里是 echo skipped + exit 0，结果是 tag 发了、GitHub
        # Release 也传了，镜像一个包都没收到而 CI 全绿 —— 出包路径上的静默跳过等于丢包。
        if [ -z "${CTL_TOKEN:-}" ]; then
          echo "ERROR: 上传 token 未配置（secret CTL_RELEASE_UPLOAD_TOKEN），但已经在发 tag。" >&2
          echo "       去 CTL 后台 Tokens 建一个带 release:upload 权限的 token 配上；本 job 拒绝静默发行。" >&2
          exit 1
        fi

        # variant 一律不传：ctl 的 ReleaseService::upload() 把 variant 当第 5 个参数喂给
        # generateFilename(…, $ext)，非空 variant 直接变成文件扩展名
        # （gnb_linux_amd64_v1.6.8-dev.main-patched），而下载侧 parseFilename 只认
        # tgz|zip|tar.gz|ipk ⇒ 记录建得出来但下不到。通道信息在包内 MANIFEST 与产物目录名里。
        #
        # is_stable 按 tag 判：ctl 的 refreshLatestFlag() 只在 stable() 作用域里选 latest，
        # 而客户端取的就是 latest —— 把 -dev 预发布报成 stable，现网节点会被推着升到开发包。
        case "$REF_NAME" in
          *-*) IS_STABLE=false ;;
          *)   IS_STABLE=true  ;;
        esac

        # 幂等判定（必须先于上传）：releases 表有
        # unique(product,version,platform,arch,variant)
        # （mynet_ctl/database/migrations/2026_03_20_013123_create_ctl_core_tables.php:35），
        # 而 ReleaseService::upload() 里是裸 Release::create()、ReleaseController::store()
        # 没有 try/catch ⇒ 同一个 tag 重推时，已经发过的那几条腿不是「跳过」而是 **500
        # Server Error**：修好一条腿想重跑整个作业，其余腿全撞这个键，publish 就永久红了。
        # 所以发之前先按 ctl 的取件路径量一次字节，判据是字节而不是「有没有这行」：
        #   取不到（404）      ⇒ 没发过，正常上传
        #   取到且 sha256 一致 ⇒ 同样的东西已经在下载面上，算通过，不重复发
        #   取到但 sha256 不一致 ⇒ 同一个版本号下内容变了 —— 红。要重发就换 tag，
        #                          绝不悄悄覆盖现网节点正在取的那一份。
        # 取件路径是公开的（DetectController.php:214 就用它给设备拼 URL），200/404 本身就是
        # 「发过没发过」的判据，不必去解析 release 列表的 JSON。
        sha256_of() {
          if command -v sha256sum >/dev/null 2>&1; then sha256sum "$1" | cut -d' ' -f1
          else shasum -a 256 "$1" | cut -d' ' -f1; fi
        }
        HAVE_SHA=0
        if command -v sha256sum >/dev/null 2>&1 || command -v shasum >/dev/null 2>&1; then HAVE_SHA=1; fi
        remote_sha_of() { # 0=下载面上有这份并给出 sha256；1=没有（含非 200，保守当作未发布）；2=探测本身失败
          local tmp code out
          tmp="$(mktemp)"
          if ! code="$(curl -sS --max-time 120 -o "$tmp" -w '%{http_code}' "${CTL_BASE}/d/gnb/$1")"; then
            rm -f "$tmp"; return 2
          fi
          if [ "$code" != "200" ]; then rm -f "$tmp"; return 1; fi
          out="$(sha256_of "$tmp")" || { rm -f "$tmp"; return 2; }
          rm -f "$tmp"
          [ -n "$out" ] || return 2
          printf '%s' "$out"
        }
        if [ "$HAVE_SHA" -ne 1 ]; then
          echo "WARN: 这台 runner 上既没有 sha256sum 也没有 shasum —— 跳过幂等判定，" >&2
          echo "      重推同一个 tag 时已发过的腿会撞 unique 键出 500，届时按上面那段读错误。" >&2
        fi
        echo "tag=$REF_NAME is_stable=$IS_STABLE 待上传 ${#PKGS[@]} 个包"

        failed=""
        skipped=0
        sent=0
        for f in "${PKGS[@]}"; do
          name="$(basename "$f")"
          # 命名契约的 SSOT 是 mynet_ctl 的 ReleaseDomainService::{generateFilename,parseFilename}：
          # {name}_{platform}_{arch}_{version}.{ext}。这里 platform 用显式枚举（和 ctl 一致），
          # 否则贪婪匹配会把 openwrt_mipsel 切成两段。platform/arch/ext 的规范化在出包侧做一次
          # （scripts/gnb-dist.sh 的「发行名规范化」段：mingw→windows、x86_64→amd64、windows 的
          # ext 按 PLATFORMS 取 zip）—— 包名与 GitHub Release 资产名从源头就同一个契约，
          # 不在这里再映射一遍，两处映射迟早对不上。
          if [[ ! "$name" =~ ^gnb_(linux|openwrt|darwin|windows|freebsd|openbsd)_([a-z0-9-]+)_(v[0-9A-Za-z.-]+)\.(tgz|zip)$ ]]; then
            echo "ERROR: 包名 $name 不符合 ctl 命名契约，拒绝上传（要改改 gnb-dist.sh 的包名段，不是改这里）" >&2
            failed="$failed $name(命名)"
            continue
          fi
          platform="${BASH_REMATCH[1]}"
          arch="${BASH_REMATCH[2]}"
          version="${BASH_REMATCH[3]}"

          # OpenWrt 这一档**不改名叫 openwrt-sdk**（2026-10-03 定）：设备侧只查 openwrt ——
          #   DetectController.php:193 写死 $platform='openwrt'，:209 自己拼
          #   gnb_openwrt_<arch>_<version>.tgz，softfpFallback(:228-241) 只在
          #   mipsel ↔ mipsel-softfp 这类 arch 变体之间**双向**回退，从不换 platform；
          #   gnb_installer.lua:414 只认 a.os=="openwrt"、:252 只 alias {openwrt,linux}。
          # openwrt-sdk 那一档虽然存在，但没有任何消费者，发过去就是「下载面查得到、
          # 设备取不到」的死路。所以 SDK/musl 构建直接顶掉老的 glibc 那条线、占用 openwrt
          # 这个名字，arch 标签用 ctl 的规范名（mipsel-softfp，规范化在 gnb-dist.sh；
          # mipsel 与 mipsel-softfp 两条腿 10-03 已合成一条，见 build_openwrt.yml）。
          #
          # openbsd 不再在这里 fail-loud：ctl 的 PLATFORMS/VALID_COMBINATIONS/parseFilename
          # 已加 openbsd。生产站那份代码是旧的、还没这个枚举时，这一档会得到 422 而不是
          # 静默丢 —— 校验在 ReleaseService::validateUpload()（:140-155），照样把 job 打红。

          # 已经在下载面上且字节一致的就不再发一遍（见上面那段幂等判定）。
          if [ "$HAVE_SHA" -eq 1 ]; then
            probe_rc=0
            existing_sha="$(remote_sha_of "$name")" || probe_rc=$?
            if [ "$probe_rc" -eq 0 ]; then
              local_sha="$(sha256_of "$f")"
              if [ "$existing_sha" = "$local_sha" ]; then
                echo "SKIP: $name 已在下载面且字节一致（sha256=${local_sha:0:12}…）"
                skipped="$((skipped + 1))"
                continue
              fi
              echo "ERROR: $name 下载面上同版本包的内容不一样 —— 本地 ${local_sha:0:12}… vs 远端 ${existing_sha:0:12}…" >&2
              echo "       同一个 (version,platform,arch) 换内容必须换 tag；别覆盖现网正在取的那份。" >&2
              failed="$failed $name(同版本内容冲突)"
              continue
            elif [ "$probe_rc" -ge 2 ]; then
              echo "WARN: 探测取件路径没走通（$CTL_BASE 连不上或读不出哈希），照旧尝试上传。" >&2
            fi
          fi

          # Accept: application/json 不是装饰：实测不带它时 ctl 的校验失败按 web 请求处理，
          # 回 302 + 一段「Redirecting to https://ctl.mynet.club」HTML，日志里只剩一个
          # 看不出原因的 302；带上它才回 422 + JSON 错误字段（今天拿真 token 实测过）。
          if ! resp="$(curl -sS --max-time 300 --retry 2 \
                        -H "Authorization: Bearer ${CTL_TOKEN}" \
                        -H 'Accept: application/json' \
                        -F product=gnb -F "version=${version}" -F "platform=${platform}" -F "arch=${arch}" \
                        -F "is_stable=${IS_STABLE}" \
                        -F "changelog=GitHub Actions ${REF_NAME} (${RUN_URL})" \
                        -F "file=@${f}" \
                        -w $'\n%{http_code}' \
                        "${CTL_BASE}/api/v2/releases")"; then
            echo "ERROR: $name 传输失败（连不上 ctl 或超时）" >&2
            failed="$failed $name(传输)"
            continue
          fi

          code="${resp##*$'\n'}"
          body="${resp%$'\n'*}"
          if [ "$code" != "201" ]; then
            echo "ERROR: $name HTTP $code —— $(printf '%s' "$body" | tr -d '\n' | head -c 400)" >&2
            if [ "$code" = "500" ]; then
              # 幂等判定已经量过字节还出 500，基本只剩一种解释：那一行被 disable 了
              # （status=0 不出现在取件路径上，所以量不到，但 unique 索引连着软删行一起算）
              # ⇒ POST 必撞键。要重发得先用 release:manage 那个 token 把旧行处理掉。
              echo "       500 且这里没量到已有文件 ⇒ 多半是同键的软删行（status=0）占着索引；" >&2
              echo "       uploads 走的是裸 Release::create()，没有 try/catch。" >&2
            fi
            failed="$failed $name(HTTP$code)"
            continue
          fi
          url="$(printf '%s' "$body" | sed -n 's/.*"download_url"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' | head -1)"
          echo "OK: $name -> ${url:-（响应里没有 download_url）}"
          sent="$((sent + 1))"
        done

        if [ -n "$failed" ]; then
          echo "有包没发出去：$failed" >&2
          exit 1
        fi
        echo "本批 ${#PKGS[@]} 个包：新发 $sent 个，已在下载面且字节一致 $skipped 个。"
