name: Build GNB For Linux

# OpenWrt 产物由 build_openwrt.yml（官方 SDK 24.10）负责，本文件只出 Linux 交叉产物。
# 这里不打补丁：构建树由 scripts/gnb-dist.sh 从 packages/RELEASE-SOURCES 里该通道的
# 固定发行源码提交 git archive 导出，源码身份不符就直接失败。

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

env:
  PROJECT: gnb
  BASE_URL: "https://download.mynet.club/gnb"
  # 想出的通道。未指定发行源码提交的通道会被 plan job 标为 skipped 并写进 summary，
  # 补丁/源码准备线在 packages/RELEASE-SOURCES 填上 commit 后，它自动进入矩阵。
  CHANNELS: main,main-patched

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      channels: ${{ steps.pick.outputs.channels }}
    steps:
      - name: Checkout tooling
        uses: actions/checkout@v4
        with:
          # 发行源码提交是历史里的固定提交，脚本要能 git archive 它们
          fetch-depth: 0

      - name: Pick buildable channels
        id: pick
        run: |
          set -euo pipefail
          buildable=""
          skipped=""
          IFS=',' read -r -a list <<< "${{ env.CHANNELS }}"
          for ch in "${list[@]}"; do
            ch="$(printf '%s' "$ch" | tr -d ' ')"
            [ -n "$ch" ] || continue
            if sh scripts/release-sources.sh require "$ch" release_source_commit >/dev/null 2>&1; then
              buildable="${buildable}\"$ch\","
            else
              skipped="$skipped $ch"
            fi
          done
          if [ -z "$buildable" ]; then
            echo "没有通道的发行源码提交被指定（CHANNELS=${{ env.CHANNELS }}）—— 不发空产物。" >&2
            echo "请由补丁/源码准备线在 packages/RELEASE-SOURCES 固定 release_source_commit。" >&2
            exit 1
          fi
          echo "channels=[${buildable%,}]" >> "$GITHUB_OUTPUT"
          {
            echo "## 通道取舍（Linux）"
            echo "- 构建: $(printf '%s' "$buildable" | tr -d '\"')"
            if [ -n "$skipped" ]; then
              echo "- **跳过**:$skipped —— packages/RELEASE-SOURCES 里 release_source_commit 仍为 UNSET"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: plan
    name: Linux ${{ matrix.arch }} (${{ matrix.channel }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 兜底：卡在任何没预料的地方也在分钟内失败并留日志，而不是 job 默认的 6 小时
    strategy:
      fail-fast: false
      matrix:
        channel: ${{ fromJSON(needs.plan.outputs.channels) }}
        # arch 必须是真正的矩阵轴。写成 matrix.include 的独立条目时，GitHub 只把
        # 最后一条并进组合（上一版因此只出 riscv64 一个包，另外八个架构静默缺席，
        # 而 publish 只看得到「下载目录里有的那些」）。
        arch:
          - amd64
          - arm64
          # armv7-softfp 已摘：软浮点这条腿要 musl.cc 的 musleabi（runner 取不到）或
          # Debian 的 armel 交叉包（为它给整条轴共用的 apt 步多下几十 MB 不值），
          # 而无 VFP 的 armv7 设备是极小概率。恢复要改的三处写在 Setup cross compiler
          # 前面那段注释里。
          - armv7-hardfp
          - mips
          - mipsel
          - mips64
          - mips64el
          # riscv64 曾被单独摘出这条轴，因为作者源码在 LP64 下有一处类型冲突
          # （gnb_conf_file.h:24 声明 gnb_uint64_t，gnb_conf_file.c:841 定义 uint64_t，
          # 而 gnb_def.h:22 把前者定为 unsigned long long）。那不是 riscv 专属：
          # amd64/arm64/mips64/mips64el 与 FreeBSD amd64 撞的是同一行同一句。
          # 现在这行修复在发行基线里（local_source_commit 98f8b4e），轴恢复完整（riscv64 在内）。
          # 摘单条架构不是修法：那是把问题藏起来，而且当时只挡住了这一类里的一例。
          - riscv64

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY" || true
          df -h

      - name: Checkout tooling
        uses: actions/checkout@v4
        with:
          # 固定发行源码提交要在历史里能 git archive 出来
          fetch-depth: 0

      - name: Resolve release tag
        id: tag
        run: |
          set -euo pipefail
          REF="${GITHUB_REF_NAME}"
          # workflow_dispatch 时 ref 是分支名（含 /），不能当包名版本号用
          if printf '%s' "$REF" | grep -qE '^v[0-9][0-9A-Za-z.-]*$'; then
            echo "tag=$REF" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$(cat version)-g$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        # 超时是留着的卫生措施，不是对某次失败的归因：apt 在这类 runner 上有两种「无限等」
        # （dpkg 锁 + 镜像连接 stalled），默认都不超时，三个 -o 把等待换成有上限的失败；
        # `</dev/null` 保证任何提示直接失败而不是等输入。8 分钟的档位对照实测：同一份
        # 包清单（含四个 mips 交叉包）在别的 runner 上 1~2 分钟装完（那些腿整 job
        # 才 2~6 分钟），这里留了 4~8 倍余量；Actions 按分钟计费，慢runner 上多等
        # 一小时也不如几分钟内失败重跑一次。
        # 更正两次记录，都栽在同一个陷阱上（GH 在 job 结束前不落日志，
        # 查 /jobs/{id}/logs 回 BlobNotFound，步骤栏还会停在旧步骤 —— 别拿没落盘的
        # 步骤状态当证据）：10-02 那轮 armv7-softfp 我先判成「卡在 apt 的 dpkg 锁上」，
        # 又改口成「卡在 musl.cc 下载上」。完整日志按时间戳算差的实测是：apt 那步确实
        # 花了 59 分钟（15:06:39→16:05:42，逐条 Get: 之间 100~260 秒空档，azure 镜像在
        # 滴流），但**它跑成功了**；真正让那条腿出不了包的是当时的 Setup musl 步骤
        # ——30 秒内取工具链失败（该步骤连同 musl.cc 依赖已在 4e1dbc3 之后整体移除，
        # 理由见下面 Setup cross compiler 前的注释）。
        timeout-minutes: 8
        run: |
          APT_OPTS="-o DPkg::Lock::Timeout=120 -o Acquire::Retries=3 -o Acquire::http::Timeout=20"
          sudo apt-get $APT_OPTS update </dev/null
          sudo apt-get $APT_OPTS install -y build-essential pkg-config wget curl git ca-certificates xz-utils tar flex bison autoconf automake libtool texinfo gawk cmake ninja-build file
          sudo apt-get $APT_OPTS install -y gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf || true
          sudo apt-get $APT_OPTS install -y gcc-mips-linux-gnu gcc-mipsel-linux-gnu gcc-mips64-linux-gnuabi64 gcc-mips64el-linux-gnuabi64 || true
          sudo apt-get $APT_OPTS install -y gcc-riscv64-linux-gnu || true

      # Linux 轴一律用 Debian/Ubuntu 的 glibc 交叉包，**不再从 musl.cc 取工具链**。
      # 取不到不是抖动：三次独立取证（tag 全矩阵那轮 + 两次单 workflow dispatch、
      # 不同 runner、相隔 6 小时）签名一致 —— IPv4 连接 20 秒超时、IPv6 Network is
      # unreachable、0 字节落盘、wget 退出码 4；同一个 URL 从本地 curl -sIL 是
      # 200 + Content-Length 102611361。也就是 GitHub 托管 runner → musl.cc 这条路不通。
      # 留着它，每条 armv7 腿都得先白烧一次连接超时，而 Actions 按分钟计费。
      #
      # 要恢复软浮点那条腿（armv7-softfp，本轮已摘）就三处一起改，别只加矩阵轴：
      #   1) apt 步加 gcc-arm-linux-gnueabi + libc6-dev-armel-cross（armel=软浮点 sysroot；
      #      实测 noble universe 里有：gcc-arm-linux-gnueabi 4:13.2.1-2ubuntu1）
      #   2) CC=arm-linux-gnueabi-gcc
      #   3) CFLAGS="-march=armv7-a -mfloat-abi=soft"  LDFLAGS="-mfloat-abi=soft"
      # 上一版在这里踩过的坑是拿 hard-float 的 gnueabihf sysroot 去编 -mfloat-abi=soft：
      #   /usr/arm-linux-gnueabihf/include/gnu/stubs.h:7: gnu/stubs-soft.h: No such file
      # 那不是「换个编译器就能成」的事 —— sysroot 里没有 soft stubs，就必须装 armel 那套。

      - name: Setup cross compiler and static flags
        run: |
          # 除原生 amd64 外一律用 Debian/Ubuntu 的 glibc 交叉包（就是 apt 步装的那批），
          # 全部静态链接。这个口径的代价要写明：静态 glibc 在链接期报
          #   warning: Using 'getaddrinfo' in statically linked applications requires at
          #   runtime the shared libraries from the glibc version used for linking
          # 即运行时要按链接期那套 glibc 取 NSS，目标设备 glibc 差得远时 DNS 可能坏。
          # musl 静态没有这个问题，但 musl.cc 从 runner 取不到（见上一段注释），
          # 换来的是「整条轴同一 libc、零外网依赖、没有白烧的超时」。
          case "${{ matrix.arch }}" in
            amd64)       export CC=gcc ;;
            arm64)       export CC=aarch64-linux-gnu-gcc ;;
            armv7-hardfp) export CC=arm-linux-gnueabihf-gcc ;;
            mips)        export CC=mips-linux-gnu-gcc ;;
            mipsel)      export CC=mipsel-linux-gnu-gcc ;;
            mips64)      export CC=mips64-linux-gnuabi64-gcc ;;
            mips64el)    export CC=mips64el-linux-gnuabi64-gcc ;;
            riscv64)     export CC=riscv64-linux-gnu-gcc ;;
            *) echo "ERROR: 矩阵里的 arch 没有配交叉编译器：${{ matrix.arch }}" >&2; exit 1 ;;
          esac
          STATIC_LINKING=true
          # 交叉包在 apt 步是软失败（|| true），这里必须硬判：以前缺编译器要跑到
          # make 里才撞出「cc1 不存在」那种看不懂的错，白烧几条腿的分钟数。
          command -v "$CC" >/dev/null 2>&1 || {
            echo "ERROR: $CC 不在 PATH —— apt 步的交叉包没装上" >&2
            exit 1
          }

          export CXX=${CC/gcc/g++}
          export AR=${CC/gcc/ar}
          export RANLIB=${CC/gcc/ranlib}
          # strip 用同工具链的那份：宿主 strip 对外来架构 ELF 不保证认
          export STRIP=${CC/gcc/strip}

          # 软/硬浮点平台的编译标志。Makefile.linux 的 GNB_CFLAGS 引用 $(CFLAGS)，
          # 所以这两个走环境变量就生效；链接标志见 Build 步骤的 --make-var。
          case "${{ matrix.arch }}" in
            armv7-hardfp)
              export CFLAGS="-march=armv7-a -mfloat-abi=hard -mfpu=vfpv3-d16"
              export LDFLAGS="-mfloat-abi=hard"
              echo "Applied hard-float flags for armv7-hardfp"
              ;;
          esac

          echo "STATIC_LINKING=$STATIC_LINKING" >> $GITHUB_ENV
          echo "CC=$CC" >> $GITHUB_ENV
          echo "CXX=$CXX" >> $GITHUB_ENV
          echo "AR=$AR" >> $GITHUB_ENV
          echo "RANLIB=$RANLIB" >> $GITHUB_ENV
          echo "STRIP=$STRIP" >> $GITHUB_ENV
          echo "CFLAGS=${CFLAGS:-}" >> $GITHUB_ENV
          echo "LDFLAGS=${LDFLAGS:-}" >> $GITHUB_ENV
          echo "arch=${{ matrix.arch }} CC=$CC STRIP=$STRIP STATIC_LINKING=$STATIC_LINKING"
          # STRIP 是否可用由 gnb-dist.sh 在构建前查（它拿到的是同一个值）

      # 一条流水线做完：导出发行源码提交 → 校验源码身份 → make → 校验四程序与能力输出
      # → strip → MANIFEST + SHA256SUMS → tgz。补丁和 Features 行都不在这里生成。
      - name: Build and package (${{ matrix.channel }} / ${{ matrix.arch }})
        shell: bash
        run: |
          set -euo pipefail
          PUBLISH="$(sh scripts/release-sources.sh require '${{ matrix.channel }}' publish)"
          args=(
            --channel '${{ matrix.channel }}'
            --os linux
            --arch '${{ matrix.arch }}'
            --tag "${{ steps.tag.outputs.tag }}"
            --out ".out/${{ steps.tag.outputs.tag }}/${{ matrix.channel }}/${{ matrix.arch }}"
            --strip-cmd "$STRIP"
            --archive
            --dist-dir ".pkg/${{ steps.tag.outputs.tag }}/$PUBLISH"
          )
          if [ -n "${CC:-}" ]; then
            args+=( --make-var "CC=$CC" )
          fi
          # Makefile.linux 里 GNB_LDFLAGS / GNB_ES_LDFLAGS 是普通赋值：命令行给值会
          # **整体替换**文件里的值，所以 -static 必须连非 DEBUG 基线
          # （-Wl,--gc-sections -L/usr/lib -s）一起给全，否则 --gc-sections 和 -s 会丢。
          # 基线漂移不会静默 —— 下一步逐二进制断言 statically linked。
          # 旧写法传的 CLI_LDFLAGS 在本仓任何 Makefile 里都不存在，等于没生效，
          # 结果只有 gnb_es 是静态的，gnb/gnb_ctl/gnb_crypto 一直动态链接 glibc。
          if [ "${STATIC_LINKING:-false}" = "true" ]; then
            args+=(
              --make-var "GNB_LDFLAGS=-Wl,--gc-sections -L/usr/lib -static -s"
              --make-var "GNB_ES_LDFLAGS=-Wl,--gc-sections -L/usr/lib -static -s"
            )
          fi
          sh scripts/gnb-dist.sh "${args[@]}"

      # 只读取证：strip 与校验和已在 gnb-dist.sh 里按正确顺序做完，这里不再动二进制，
      # 只如实报出链接方式并与 STATIC_LINKING 的期望对齐。
      # 期望静态却出动态 = 失败，而不是发一个名字号称通用、实际依赖宿主 glibc 的包。
      - name: Verify linking type (read-only)
        shell: bash
        run: |
          set -euo pipefail
          OUT=".out/${{ steps.tag.outputs.tag }}/${{ matrix.channel }}/${{ matrix.arch }}"
          if [ ! -d "$OUT" ]; then echo "OUT missing: $OUT"; exit 1; fi
          missing=0
          for f in gnb_ctl gnb_es gnb_crypto gnb; do
            if [ -f "$OUT/$f" ]; then
              info=$(file -b "$OUT/$f")
              size=$(stat -c%s "$OUT/$f")
              echo "$f: $info (${size} bytes)"
              if [ "${STATIC_LINKING:-false}" = "true" ]; then
                if echo "$info" | grep -qi "statically linked\|static-pie linked"; then
                  echo "  ✓ $f is static (as expected)"
                else
                  echo "  ERROR: $f is not static but static linking was enabled"; missing=1
                fi
              else
                if echo "$info" | grep -qi "statically linked\|static-pie linked"; then
                  echo "  ✓ $f is static (bonus)"
                elif echo "$info" | grep -qi "dynamically linked"; then
                  echo "  ✓ $f is dynamic (as expected)"
                else
                  echo "  ? $f linking status unknown: $info"
                fi
              fi
            else
              echo "  ERROR: binary $f not found in $OUT"; missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "有二进制缺失或链接类型与期望不符。" >&2
            exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gnb-${{ matrix.channel }}-linux-${{ matrix.arch }}
          path: |
            .pkg/${{ steps.tag.outputs.tag }}/*/*.tgz
            .pkg/${{ steps.tag.outputs.tag }}/*/*.zip
          if-no-files-found: error

  publish:
    needs: [plan, build]
    # gh release create/upload 打 POST/PATCH /releases：默认 workflow token 是只读的，
    # 上一轮就是这么挂在 HTTP 403 "Resource not accessible by integration"。
    # 建 Release 属于发行动作，显式给 contents: write，其余权限保持收窄。
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout tooling
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: .release/

      # 分类依据是产物目录名里的通道段 + packages/RELEASE-SOURCES 的 publish 字段：
      # gnb-<channel>-linux-<arch> 里的 channel 是精确字符串，不做包名模式匹配
      # （包名模式区分不了两类：gnb_*_v*.tgz 同样会匹配开发包名）。
      - name: Split production vs internal artifacts
        run: |
          set -euo pipefail
          mkdir -p .release/production .release/internal
          # 通道名互为前缀（main / main-patched），不能拿 gnb-<channel>-* 做模式匹配：
          # 那会让 main 把 main-patched 的产物按 main 的类别搬走。这里对每个产物目录取
          # 「匹配得上的最长通道名」，类别一律回 SSOT 的 publish 字段查。
          for d in .release/*/; do
            name="$(basename "$d")"
            case "$name" in
              production|internal) continue ;;
              gnb-*) : ;;
              *) continue ;;
            esac
            ch=""
            for c in $(sh scripts/release-sources.sh channels all); do
              case "$name" in "gnb-$c-"*) [ "${#c}" -gt "${#ch}" ] && ch="$c" ;; esac
            done
            if [ -z "$ch" ]; then
              echo "产物目录 $name 对不上任何已登记通道，拒绝静默发行" >&2
              exit 1
            fi
            cls="$(sh scripts/release-sources.sh require "$ch" publish)"
            # download-artifact@v4 保留了上传时的相对路径，归档其实在 <类>/ 子目录里，
            # 所以 find 不限深度；归类只认目录名对应的通道，不认这个子目录名。
            # 扩展名必须两种都收：windows 按 ctl 的 windows 档出 .zip，漏了它就会被下面的
            # rm -rf "$d" 连目录一起删掉，而 _left 只数 tgz 时看不出来。
            find "$d" -type f \( -name '*.tgz' -o -name '*.zip' \) -exec mv -t .release/"$cls"/ {} +
            rm -rf "$d"
          done
          _left=$(find .release -type f \( -name '*.tgz' -o -name '*.zip' \) \
                    -not -path '.release/production/*' -not -path '.release/internal/*' | wc -l | tr -d ' ')
          if [ "$_left" -ne 0 ]; then
            echo "有 $((_left)) 个产物未归类，拒绝静默发行：" >&2
            find .release -type f \( -name '*.tgz' -o -name '*.zip' \) \
              -not -path '.release/production/*' -not -path '.release/internal/*' >&2
            exit 1
          fi
          echo "production: $(ls .release/production 2>/dev/null | tr '\n' ' ')"
          echo "internal  : $(ls .release/internal 2>/dev/null | tr '\n' ' ')"

      # 校验文件按平台命名（checksums-<平台>.txt），不共用一个 checksums.txt。
      - name: Generate checksums
        run: |
          set -euo pipefail
          cd .release/production
          shopt -s nullglob
          PKGS=(*.tgz *.zip)
          if [ ${#PKGS[@]} -eq 0 ]; then
            echo "本批没有生产通道产物，跳过 checksums"; exit 0
          fi
          # 每个平台一个校验文件，不共用 checksums.txt：darwin/linux/openwrt/windows 四个
          # workflow 会同时往同一个 Release 传这个同名文件（tag v1.6.8-dev 实测
          # HTTP 422 ReleaseAsset.name already exists），而「下载-合并-回传」是读-改-写，
          # 并发下会静默丢条目。校验文件按平台命名就没有竞争，也不需要 gh 凭据。
          sha256sum "${PKGS[@]}" > checksums-linux.txt
          cat checksums-linux.txt

      - name: Create/Update GitHub Release (clobber same-name assets only)
        if: startsWith(github.ref, 'refs/tags/')  # 没有 tag 就没有 Release：dispatch 只验构建，绝不拿分支名去建发行物
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          TAG="${{ github.ref_name }}"
          # 开发通道产物也进 GitHub Release（内部可取），但下面 CTL 上传只发生产包。
          # production/ 里除 tgz 还有本平台的 checksums-linux.txt，一并作为 Release 资产。
          FILES=(.release/production/* .release/internal/*)
          if [ ${#FILES[@]} -eq 0 ]; then echo "无产物可发布"; exit 0; fi
          echo "Publishing release assets for $TAG: ${FILES[*]}"
          if ! gh release upload "$TAG" "${FILES[@]}" --clobber --repo "${GITHUB_REPOSITORY}"; then
            echo "Upload failed (release may not exist). Creating release then retrying upload..."
            gh release create "$TAG" --title "Release $TAG" --generate-notes --repo "${GITHUB_REPOSITORY}" || true
            gh release upload "$TAG" "${FILES[@]}" --clobber --repo "${GITHUB_REPOSITORY}"
          fi

      # 生产包进真正的下载面 = ctl.mynet.club 的 release 上传接口（对外取件路径 /d/gnb/<文件名>）。
      # 不再 rsync 到 download.mynet.club：那条链路在 mynet_ctl 的知识库里已判废弃
      # （docs/knowledge-base/v2-upgrade-plan.md:20「download.mynet.club 已废弃…已禁止目录访问」、
      # :24「CI 未对接 CTL」），实测 /gnb/<tag>/ 下面也确实一个文件都没有。
      # 命名/枚举/variant/is_stable 的契约都写在 .github/actions/ctl-publish/action.yml 里，五轴共用一份。
      - name: Publish production packages to CTL
        if: startsWith(github.ref, 'refs/tags/')
        uses: ./.github/actions/ctl-publish
        with:
          token: ${{ secrets.CTL_RELEASE_UPLOAD_TOKEN }}
