name: Build BSD

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

env:
  PROJECT: gnb
  BASE_URL: "https://download.mynet.club/gnb"
  CHANNELS: main,main-patched

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      channels: ${{ steps.pick.outputs.channels }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pick buildable channels
        id: pick
        run: |
          set -euo pipefail
          buildable=""
          skipped=""
          IFS=',' read -r -a list <<< "${{ env.CHANNELS }}"
          for ch in "${list[@]}"; do
            ch="$(printf '%s' "$ch" | tr -d ' ')"
            [ -n "$ch" ] || continue
            if sh scripts/release-sources.sh require "$ch" release_source_commit >/dev/null 2>&1; then
              buildable="${buildable}\"$ch\","
            else
              skipped="$skipped $ch"
            fi
          done
          if [ -z "$buildable" ]; then
            echo "没有通道的发行源码提交被指定（CHANNELS=${{ env.CHANNELS }}）—— 不发空产物。" >&2
            exit 1
          fi
          echo "channels=[${buildable%,}]" >> "$GITHUB_OUTPUT"
          {
            echo "## 通道取舍（BSD）"
            echo "- 构建: $(printf '%s' "$buildable" | tr -d '\"')"
            if [ -n "$skipped" ]; then
              echo "- **跳过**:$skipped —— packages/RELEASE-SOURCES 里 release_source_commit 仍为 UNSET"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # 两个平台各自一个 VM job；每个 (channel × os) 的 gnb-dist job 内部一次 make
  # 产齐四程序（旧版只拷一个 gnb 单文件，违反「四程序同一次构建」，已改掉）。
  build-freebsd:
    needs: plan
    name: FreeBSD amd64 (${{ matrix.channel }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        channel: ${{ fromJSON(needs.plan.outputs.channels) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: tag
        run: |
          set -euo pipefail
          REF="${GITHUB_REF_NAME}"
          if printf '%s' "$REF" | grep -qE '^v[0-9][0-9A-Za-z.-]*$'; then
            echo "tag=$REF" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$(cat version)-g$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      # prepare 和 run 必须在同一个 step 里：vmactions 每个 `uses:` 调用都会重新起一台
      # VM 并从镜像缓存同步工作区，上一个 step 的 pkg install 不会留到下一个 step
      # （上一版 Setup 步骤装了 git，构建步骤里就没有了）。
      - name: Build and package (${{ matrix.channel }})
        uses: vmactions/freebsd-vm@v1
        with:
          release: "13.2"
          usesh: true
          prepare: |
            pkg install -y gmake git
          run: |
            set -eu
            # pkg 装的 git/gmake 在 /usr/local/bin，VM 里非登录 sh 的默认 PATH 不含它
            PATH=/usr/local/bin:$PATH; export PATH
            # 工作区（含 .git）是 rsync 从宿主同步进来的，属主是宿主的 uid；
            # git 的 dubious-ownership 检查会因此拒绝读仓库，表现为「找不到提交」。
            git config --global --add safe.directory "$PWD"
            # VM 里 /bin/sh 是 FreeBSD sh：gnb-dist.sh 全程 POSIX sh，无需 bash
            sh scripts/gnb-dist.sh \
              --channel ${{ matrix.channel }} \
              --os freebsd \
              --arch amd64 \
              --tag ${{ steps.tag.outputs.tag }} \
              --make gmake \
              --strip-cmd strip \
              --archive \
              --dist-dir .pkg/${{ steps.tag.outputs.tag }}/$(sh scripts/release-sources.sh require ${{ matrix.channel }} publish)

      - uses: actions/upload-artifact@v4
        with:
          name: gnb-${{ matrix.channel }}-freebsd-amd64
          path: .pkg/${{ steps.tag.outputs.tag }}/*/*.tgz
          if-no-files-found: error

  build-openbsd:
    needs: plan
    name: OpenBSD amd64 (${{ matrix.channel }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        channel: ${{ fromJSON(needs.plan.outputs.channels) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: tag
        run: |
          set -euo pipefail
          REF="${GITHUB_REF_NAME}"
          if printf '%s' "$REF" | grep -qE '^v[0-9][0-9A-Za-z.-]*$'; then
            echo "tag=$REF" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$(cat version)-g$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      # 同 FreeBSD：prepare 与 run 必须同 step，否则装好的 git 在构建 step 里不存在
      # （上一版 OpenBSD 就是报「需要 git 才能导出固定提交」）。
      - name: Build and package (${{ matrix.channel }})
        uses: vmactions/openbsd-vm@v1
        with:
          # 7.9 = 当前稳定版。上一版钉 7.5，VM 能起但 pkg_add 报
          #   https://cdn.openbsd.org/pub/OpenBSD/7.5/packages/amd64/: no such dir
          # OpenBSD 官方只镜像当前 release（+ snapshots）的 packages，旧版端口集会下架，
          # 所以这里跟着当前版走，别钉死在某个 EOL 版本上。
          release: "7.9"
          usesh: true
          prepare: |
            pkg_add gmake git
          run: |
            set -eu
            # OpenBSD 默认 PATH 只有 /bin:/usr/bin，pkg_add 装的 git 在 /usr/local/bin
            PATH=/usr/local/bin:$PATH; export PATH
            # 工作区（含 .git）是 rsync 从宿主同步进来的，属主是宿主的 uid；
            # git 的 dubious-ownership 检查会因此拒绝读仓库，表现为「找不到提交」。
            git config --global --add safe.directory "$PWD"
            sh scripts/gnb-dist.sh \
              --channel ${{ matrix.channel }} \
              --os openbsd \
              --arch amd64 \
              --tag ${{ steps.tag.outputs.tag }} \
              --make gmake \
              --strip-cmd strip \
              --archive \
              --dist-dir .pkg/${{ steps.tag.outputs.tag }}/$(sh scripts/release-sources.sh require ${{ matrix.channel }} publish)

      - uses: actions/upload-artifact@v4
        with:
          name: gnb-${{ matrix.channel }}-openbsd-amd64
          path: .pkg/${{ steps.tag.outputs.tag }}/*/*.tgz
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [plan, build-freebsd, build-openbsd]
    # softprops/action-gh-release 建/改 Release 要 POST /releases：默认 workflow token
    # 只读，会在同一处 HTTP 403（其余四条线的 gh 版已经撞到过）。显式收窄到 contents: write。
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: .release/

      - name: Split production vs internal artifacts
        run: |
          set -euo pipefail
          mkdir -p .release/production .release/internal
          # 通道名互为前缀（main / main-patched），不能拿 gnb-<channel>-* 做模式匹配：
          # 那会让 main 把 main-patched 的产物按 main 的类别搬走。这里对每个产物目录取
          # 「匹配得上的最长通道名」，类别一律回 SSOT 的 publish 字段查。
          for d in .release/*/; do
            name="$(basename "$d")"
            case "$name" in
              production|internal) continue ;;
              gnb-*) : ;;
              *) continue ;;
            esac
            ch=""
            for c in $(sh scripts/release-sources.sh channels all); do
              case "$name" in "gnb-$c-"*) [ "${#c}" -gt "${#ch}" ] && ch="$c" ;; esac
            done
            if [ -z "$ch" ]; then
              echo "产物目录 $name 对不上任何已登记通道，拒绝静默发行" >&2
              exit 1
            fi
            cls="$(sh scripts/release-sources.sh require "$ch" publish)"
            # download-artifact@v4 保留了上传时的相对路径，tgz 其实在 <类>/ 子目录里，
            # 所以 find 不限深度；归类只认目录名对应的通道，不认这个子目录名。
            find "$d" -type f -name '*.tgz' -exec mv -t .release/"$cls"/ {} +
            rm -rf "$d"
          done
          _left=$(find .release -type f -name '*.tgz' \
                    -not -path '.release/production/*' -not -path '.release/internal/*' | wc -l | tr -d ' ')
          if [ "$_left" -ne 0 ]; then
            echo "有 $((_left)) 个产物未归类，拒绝静默发行：" >&2
            find .release -type f -name '*.tgz' \
              -not -path '.release/production/*' -not -path '.release/internal/*' >&2
            exit 1
          fi
          echo "production: $(ls .release/production 2>/dev/null | tr '\n' ' ')"
          echo "internal  : $(ls .release/internal 2>/dev/null | tr '\n' ' ')"

      - name: Release and Publish
        # 没有 tag 就没有 Release：dispatch 只验构建，绝不拿分支名去建发行物
        # （上一版这里无条件跑，softprops 报「GitHub Releases requires a tag」把
        #  一次本来全绿的窄验证染成红色，看不出真失败）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            .release/production/*.tgz
            .release/internal/*.tgz

      # 与 darwin/linux/windows 同一口径：只有生产通道包进下载目录，且落到 ${TAG}/ 子目录。
      # 旧版把裸 gnb 单文件 rsync 到 REMOTE_DIR 根（既无 tag 也含 StrictHostKeyChecking=no），
      # 单文件还违反「四程序同一次构建」，已改掉。
      - name: Upload to remote via rsync (production packages only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          SSH_HOST: ${{ secrets.DOWNLOAD_SSH_HOST }}
          SSH_USER: ${{ secrets.DOWNLOAD_SSH_USER }}
          SSH_KEY: ${{ secrets.DOWNLOAD_SSH_KEY }}
          SSH_PORT: ${{ secrets.DOWNLOAD_SSH_PORT }}
          REMOTE_DIR: ${{ secrets.DOWNLOAD_SSH_REMOTE_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          SRC_DIR=".release/production"
          if [[ ! -d "$SRC_DIR" ]] || [[ -z "$(ls -A "$SRC_DIR" 2>/dev/null)" ]]; then
            echo "没有生产通道产物（internal/ 里的开发包不进下载目录）"; exit 0; fi
          if [[ -z "${SSH_HOST:-}" || -z "${SSH_USER:-}" || -z "${SSH_KEY:-}" || -z "${REMOTE_DIR:-}" ]]; then
            echo "SSH upload skipped (secrets not fully configured)."; exit 0; fi
          TAG="${{ github.ref_name }}"
          PORT="${SSH_PORT:-22}"
          DEST_DIR="${REMOTE_DIR%/}/${TAG}/"
          mkdir -p ~/.ssh; chmod 700 ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa; chmod 600 ~/.ssh/id_rsa
          if [[ "$PORT" != "22" ]]; then
            ssh-keyscan -p "$PORT" -t rsa,ecdsa,ed25519 "$SSH_HOST" | awk -v h="$SSH_HOST" -v p="$PORT" '{ $1 = "["h"]:"p; print }' >> ~/.ssh/known_hosts 2>/dev/null || true
          else
            ssh-keyscan -p "$PORT" -t rsa,ecdsa,ed25519 "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          fi
          chmod 644 ~/.ssh/known_hosts || true
          SSH_OPTS="-i ~/.ssh/id_rsa -p $PORT -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts -o BatchMode=yes -o ConnectTimeout=15"
          ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" "echo 'SSH OK'" || { echo "SSH connectivity failed"; exit 1; }
          ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" "mkdir -p '$DEST_DIR'"
          rsync -avz -e "ssh $SSH_OPTS" "$SRC_DIR/" "$SSH_USER@$SSH_HOST:$DEST_DIR"
