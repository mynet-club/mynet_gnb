name: Build GNB For OpenWrt (SDK 24.10)

# 使用官方 OpenWrt SDK 24.10 编译，对应本地 build_openwrt.sh 的逻辑
# 优势：GCC 13.3.0 + musl 1.2.5，与 OpenWrt 官方包使用同一工具链，兼容性最好
# 产物为动态链接 musl libc，OpenWrt 设备上有 musl 运行时，可直接运行

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

env:
  PROJECT: gnb
  SDK_VERSION: "24.10.0"
  SDK_GCC: "13.3.0"
  CHANNELS: main,main-patched

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      channels: ${{ steps.pick.outputs.channels }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pick buildable channels
        id: pick
        run: |
          set -euo pipefail
          buildable=""
          skipped=""
          IFS=',' read -r -a list <<< "${{ env.CHANNELS }}"
          for ch in "${list[@]}"; do
            ch="$(printf '%s' "$ch" | tr -d ' ')"
            [ -n "$ch" ] || continue
            if sh scripts/release-sources.sh require "$ch" release_source_commit >/dev/null 2>&1; then
              buildable="${buildable}\"$ch\","
            else
              skipped="$skipped $ch"
            fi
          done
          if [ -z "$buildable" ]; then
            echo "没有通道的发行源码提交被指定（CHANNELS=${{ env.CHANNELS }}）—— 不发空产物。" >&2
            exit 1
          fi
          echo "channels=[${buildable%,}]" >> "$GITHUB_OUTPUT"
          {
            echo "## 通道取舍（OpenWrt）"
            echo "- 构建: $(printf '%s' "$buildable" | tr -d '\"')"
            if [ -n "$skipped" ]; then
              echo "- **跳过**:$skipped —— packages/RELEASE-SOURCES 里 release_source_commit 仍为 UNSET"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: plan
    name: OpenWrt ${{ matrix.arch }} (${{ matrix.channel }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        channel: ${{ fromJSON(needs.plan.outputs.channels) }}
        # arch 必须是真正的矩阵轴。写成 matrix.include 的独立条目时，GitHub 只把
        # 最后一条并进组合（上一版因此只出了 armv7，其余五个 target 静默缺席）。
        # 每个 arch 对应的 SDK profile 见下面的 Resolve SDK profile 步骤。
        # armv7-sf (mxs/generic) 未列入：i.MX28 等无 VFP 设备较罕见，且 OpenWrt 24.10
        # 可能已放弃该 target。
        arch: [arm64, amd64, mipsel, mipsel-sf, mips, armv7]

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY" || true
          df -h

      - name: Checkout tooling
        uses: actions/checkout@v4
        with:
          # 固定发行源码提交要在历史里能 git archive 出来
          fetch-depth: 0

      - name: Resolve release tag
        id: tag
        run: |
          set -euo pipefail
          REF="${GITHUB_REF_NAME}"
          if printf '%s' "$REF" | grep -qE '^v[0-9][0-9A-Za-z.-]*$'; then
            echo "tag=$REF" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$(cat version)-g$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential wget zstd tar file

      # arch → OpenWrt SDK profile（target 目录、SDK 包名、libc 后缀、包架构名）
      - name: Resolve SDK profile for ${{ matrix.arch }}
        id: sdk
        run: |
          set -euo pipefail
          case '${{ matrix.arch }}' in
            arm64)     p='armsr/armv8     armsr-armv8      musl       aarch64_generic'        ;;
            amd64)     p='x86/64          x86-64           musl       x86_64'                 ;;
            mipsel)    p='ramips/mt7621   ramips-mt7621    musl       mipsel_24kc'            ;;   # hard-float
            mipsel-sf) p='ramips/mt7620   ramips-mt7620    musl       mipsel_24kc'            ;;   # soft-float (MT7620 等无 FPU)
            mips)      p='ath79/generic   ath79-generic    musl       mips_24kc'              ;;   # soft-float (AR71xx/AR9xxx)
            armv7)     p='bcm27xx/bcm2709 bcm27xx-bcm2709  musl_eabi  arm_cortex-a7_neon-vfpv4' ;;  # hard-float
            *) echo "OpenWrt 矩阵里没有 '${{ matrix.arch }}' 这个 target" >&2; exit 1 ;;
          esac
          # shellcheck disable=SC2086  # 固定四列，按空白切开即可
          set -- $p
          echo "sdk_target=$1"  >> "$GITHUB_OUTPUT"
          echo "sdk_name=$2"    >> "$GITHUB_OUTPUT"
          echo "sdk_libc=$3"    >> "$GITHUB_OUTPUT"
          echo "pkg_arch=$4"    >> "$GITHUB_OUTPUT"

      - name: Cache OpenWrt SDK ${{ env.SDK_VERSION }} / ${{ matrix.arch }}
        id: sdk_cache
        uses: actions/cache@v4
        with:
          path: /opt/openwrt-sdk/${{ env.SDK_VERSION }}/${{ steps.sdk.outputs.sdk_name }}
          key: openwrt-sdk-${{ env.SDK_VERSION }}-${{ steps.sdk.outputs.sdk_name }}-gcc${{ env.SDK_GCC }}-v1

      - name: Download and extract OpenWrt SDK
        if: steps.sdk_cache.outputs.cache-hit != 'true'
        run: |
          SDK_FILE="openwrt-sdk-${{ env.SDK_VERSION }}-${{ steps.sdk.outputs.sdk_name }}_gcc-${{ env.SDK_GCC }}_${{ steps.sdk.outputs.sdk_libc }}.Linux-x86_64.tar.zst"
          SDK_URL="https://downloads.openwrt.org/releases/${{ env.SDK_VERSION }}/targets/${{ steps.sdk.outputs.sdk_target }}/${SDK_FILE}"
          echo "Downloading SDK: $SDK_URL"
          wget -q --show-progress -O "/tmp/${SDK_FILE}" "$SDK_URL"
          mkdir -p "/opt/openwrt-sdk/${{ env.SDK_VERSION }}"
          cd "/opt/openwrt-sdk/${{ env.SDK_VERSION }}"
          tar --use-compress-program=unzstd -xf "/tmp/${SDK_FILE}"
          # 将解压出的目录统一重命名为 sdk_name，方便后续步骤定位
          EXTRACTED=$(ls -d openwrt-sdk-* 2>/dev/null | head -1)
          if [ -z "$EXTRACTED" ]; then
            echo "ERROR: SDK extraction failed, no openwrt-sdk-* directory found"
            ls -la
            exit 1
          fi
          mv "$EXTRACTED" "${{ steps.sdk.outputs.sdk_name }}"
          rm -f "/tmp/${SDK_FILE}"
          echo "SDK ready at: /opt/openwrt-sdk/${{ env.SDK_VERSION }}/${{ steps.sdk.outputs.sdk_name }}"

      - name: Find SDK toolchain GCC
        id: toolchain
        run: |
          SDK_DIR="/opt/openwrt-sdk/${{ env.SDK_VERSION }}/${{ steps.sdk.outputs.sdk_name }}"
          echo "SDK_DIR: $SDK_DIR"
          echo "Toolchain dirs:"
          ls "$SDK_DIR/staging_dir/" | grep toolchain || echo "(none)"

          # 找 *-openwrt-linux-*-gcc（排除 -cc 链接、g++ 等）
          CC=$(find "$SDK_DIR/staging_dir" -path "*/bin/*-openwrt-linux-*gcc" ! -name "*g++*" ! -name "*-cc" 2>/dev/null | head -1)
          if [ -z "$CC" ]; then
            echo "ERROR: Could not find GCC binary in SDK staging_dir"
            find "$SDK_DIR/staging_dir" -name "*gcc*" 2>/dev/null | head -20
            exit 1
          fi
          echo "Found CC: $CC"
          $CC --version | head -1

          STAGING_DIR="$SDK_DIR/staging_dir"
          STRIP=$(find "$SDK_DIR/staging_dir" -path "*/bin/*-openwrt-linux-*strip" ! -name "*-cc" 2>/dev/null | head -1)
          echo "cc=$CC" >> "$GITHUB_OUTPUT"
          echo "staging_dir=$STAGING_DIR" >> "$GITHUB_OUTPUT"
          echo "strip=$STRIP" >> "$GITHUB_OUTPUT"

      # 上游新的 Makefile.openwrt 把 -lz 硬写进链接行（作者快照起），CFLAGS 里却只有
      # -I./libs —— 编译期吃的是仓内 vendored 的 libs/zlib/zlib.h，链接期要的是外部 libz，
      # 口径本身是分裂的。zlib 也不是空转：src/packet_filter/gnb_pf_zip.o 就在
      # Makefile.openwrt.inc:59 的 PF 对象表里，deflate/inflate 真用 z_stream；
      # 那个 -DNO_GZIP=1 全树没有任何 #ifdef 读它（只剩各 Makefile 自己在传）。
      # 按上游口径走：不动源码，在构建环境里补该 target 的真实 zlib —— 从官方仓库取
      # zlib-dev ipk（1.3.1，与 vendored 头同版本，不会引入 ABI 斜差），只用里面的 libz.a。
      # 取 .a 不取 .so：静态库直接进产物，设备侧不必再装 zlib 运行时；换 .so 等于凭空
      # 加一条依赖。
      - name: Provide zlib for the SDK link step
        id: zlib
        run: |
          set -euo pipefail
          arch='${{ steps.sdk.outputs.pkg_arch }}'
          base="https://downloads.openwrt.org/releases/${{ env.SDK_VERSION }}/packages/$arch/base"
          listing="$(curl -fsSL "$base/")"
          hits="$(printf '%s\n' "$listing" | grep -oE 'zlib-dev_[^"<>]*\.ipk' | sort -u || true)"
          n="$(printf '%s' "$hits" | grep -c '' || true)"
          if [ "$n" -ne 1 ]; then
            echo "在 $base 找到 $n 个 zlib-dev ipk，无法确定该用哪个：" >&2
            printf '%s\n' "$hits" >&2
            exit 1
          fi
          ipk="$hits"
          dest="$RUNNER_TEMP/zlib-$arch"
          rm -rf "$dest"; mkdir -p "$dest"
          curl -fsSL -o "$RUNNER_TEMP/$ipk" "$base/$ipk"
          # ipk 是两层结构：外层 tar 里装 debian-binary/control.tar.gz/data.tar.gz，
          # 内层 data.tar.gz 才装 ./usr/lib/libz.a。成员名一律带 ./ 前缀，而 GNU tar
          # 解包默认 --anchored，用裸名 data.tar.gz 点成员会报 "Not found in archive"
          # （macOS 的 bsdtar 不锚定，所以这条上一版本地验过、CI 六个架构全灭）。
          # 这里不做成员匹配：外层整包解出，再解内层，最后按路径断言。
          tar -xf "$RUNNER_TEMP/$ipk" -C "$dest"
          tar -xzf "$dest/data.tar.gz" -C "$dest"
          if [ ! -f "$dest/usr/lib/libz.a" ]; then
            echo "ipk $ipk 里没有 usr/lib/libz.a，换口径之前不要往下构：" >&2
            ls -R "$dest" >&2
            exit 1
          fi
          ls -l "$dest/usr/lib/libz.a"
          echo "libdir=$dest/usr/lib" >> "$GITHUB_OUTPUT"
          echo "source=$base/$ipk"    >> "$GITHUB_OUTPUT"

      # 不 apply 补丁：gnb-dist.sh 从 packages/RELEASE-SOURCES 指定的固定提交导出源码树，
      # 校验源码身份 → make → 校验四程序与能力输出 → MANIFEST/SHA256SUMS → tgz（包名带通道段
      # 与否由 publish 类决定）。SDK 工具链通过 --make-var / 环境变量传入。
      - name: Build and package (${{ matrix.channel }} / ${{ matrix.arch }})
        env:
          STAGING_DIR: ${{ steps.toolchain.outputs.staging_dir }}
        run: |
          set -euo pipefail
          PUBLISH="$(sh scripts/release-sources.sh require '${{ matrix.channel }}' publish)"
          STRIP_ARG=""
          if [ -n "${{ steps.toolchain.outputs.strip }}" ]; then
            STRIP_ARG="--strip-cmd ${{ steps.toolchain.outputs.strip }}"
          fi
          # shellcheck disable=SC2086  # strip 命令可能带参数，这里就是要按词传下去
          sh scripts/gnb-dist.sh \
            --channel '${{ matrix.channel }}' \
            --os openwrt \
            --arch '${{ matrix.arch }}' \
            --tag "${{ steps.tag.outputs.tag }}" \
            --make-var "CC=${{ steps.toolchain.outputs.cc }}" \
            --make-var "LDFLAGS=-L${{ steps.zlib.outputs.libdir }}" \
            --make-var DEBUG=0 \
            $STRIP_ARG \
            --archive \
            --dist-dir ".pkg/${{ steps.tag.outputs.tag }}/$PUBLISH"

      - name: Cleanup
        if: always()
        run: |
          rm -rf "$GITHUB_WORKSPACE/.out" "$GITHUB_WORKSPACE/bin" || true
          df -h

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gnb-${{ matrix.channel }}-openwrt-${{ matrix.arch }}
          path: .pkg/${{ steps.tag.outputs.tag }}/*/*.tgz
          if-no-files-found: error

  publish:
    needs: [plan, build]
    # gh release create/upload 打 POST/PATCH /releases：默认 workflow token 是只读的，
    # 上一轮就是这么挂在 HTTP 403 "Resource not accessible by integration"。
    # 建 Release 属于发行动作，显式给 contents: write，其余权限保持收窄。
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: .release/

      - name: Split production vs internal artifacts
        run: |
          set -euo pipefail
          mkdir -p .release/production .release/internal
          # 通道名互为前缀（main / main-patched），不能拿 gnb-<channel>-* 做模式匹配：
          # 那会让 main 把 main-patched 的产物按 main 的类别搬走。这里对每个产物目录取
          # 「匹配得上的最长通道名」，类别一律回 SSOT 的 publish 字段查。
          for d in .release/*/; do
            name="$(basename "$d")"
            case "$name" in
              production|internal) continue ;;
              gnb-*) : ;;
              *) continue ;;
            esac
            ch=""
            for c in $(sh scripts/release-sources.sh channels all); do
              case "$name" in "gnb-$c-"*) [ "${#c}" -gt "${#ch}" ] && ch="$c" ;; esac
            done
            if [ -z "$ch" ]; then
              echo "产物目录 $name 对不上任何已登记通道，拒绝静默发行" >&2
              exit 1
            fi
            cls="$(sh scripts/release-sources.sh require "$ch" publish)"
            # download-artifact@v4 保留了上传时的相对路径，tgz 其实在 <类>/ 子目录里，
            # 所以 find 不限深度；归类只认目录名对应的通道，不认这个子目录名。
            find "$d" -type f -name '*.tgz' -exec mv -t .release/"$cls"/ {} +
            rm -rf "$d"
          done
          _left=$(find .release -type f -name '*.tgz' \
                    -not -path '.release/production/*' -not -path '.release/internal/*' | wc -l | tr -d ' ')
          if [ "$_left" -ne 0 ]; then
            echo "有 $((_left)) 个产物未归类，拒绝静默发行：" >&2
            find .release -type f -name '*.tgz' \
              -not -path '.release/production/*' -not -path '.release/internal/*' >&2
            exit 1
          fi
          echo "production: $(ls .release/production 2>/dev/null | tr '\n' ' ')"
          echo "internal  : $(ls .release/internal 2>/dev/null | tr '\n' ' ')"

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd .release/production
          if [ -z "$(ls -A *.tgz 2>/dev/null)" ]; then
            echo "本批没有生产通道产物，跳过 checksums"; exit 0
          fi
          # 按平台命名，不共用 checksums.txt：四个 workflow 并发往同一个 Release 传同名文件
          # 会撞（tag v1.6.8-dev 实测 HTTP 422 ReleaseAsset.name already exists）。
          sha256sum *.tgz > checksums-openwrt.txt
          cat checksums-openwrt.txt

      - name: Upload checksums artifact
        uses: actions/upload-artifact@v4
        with:
          name: checksums-openwrt
          path: .release/production/checksums-openwrt.txt

      # 旧版这一格写的是 upload-artifact，OpenWrt 的 tgz 其实从没进过 GitHub Release，
      # 也从没进下载目录 —— 设备上按 URL 取包就一直缺 OpenWrt。这里补成真正的发行。
      - name: Upload to GitHub Release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          TAG="${{ github.ref_name }}"
          FILES=(.release/production/* .release/internal/*)
          if [ ${#FILES[@]} -eq 0 ]; then echo "无产物可发布"; exit 0; fi
          echo "Uploading to release $TAG: ${FILES[*]}"
          gh release upload "$TAG" "${FILES[@]}" --clobber --repo "${GITHUB_REPOSITORY}" || {
            echo "Upload failed, attempting to create release first..."
            gh release create "$TAG" --title "Release $TAG" --notes "OpenWrt SDK build" || true
            gh release upload "$TAG" "${FILES[@]}" --clobber --repo "${GITHUB_REPOSITORY}"
          }

      - name: Upload to remote via rsync (production packages only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          SSH_HOST: ${{ secrets.DOWNLOAD_SSH_HOST }}
          SSH_USER: ${{ secrets.DOWNLOAD_SSH_USER }}
          SSH_KEY: ${{ secrets.DOWNLOAD_SSH_KEY }}
          SSH_PORT: ${{ secrets.DOWNLOAD_SSH_PORT }}
          REMOTE_DIR: ${{ secrets.DOWNLOAD_SSH_REMOTE_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          SRC_DIR=".release/production"
          if [[ ! -d "$SRC_DIR" ]] || [[ -z "$(ls -A "$SRC_DIR"/*.tgz 2>/dev/null)" ]]; then
            echo "没有生产通道产物（internal/ 里的开发包不进下载目录）"; exit 0; fi
          if [[ -z "${SSH_HOST:-}" || -z "${SSH_USER:-}" || -z "${SSH_KEY:-}" || -z "${REMOTE_DIR:-}" ]]; then
            echo "SSH upload skipped (secrets not fully configured)."; exit 0; fi
          TAG="${{ github.ref_name }}"
          PORT="${SSH_PORT:-22}"
          DEST_DIR="${REMOTE_DIR%/}/${TAG}/"
          mkdir -p ~/.ssh; chmod 700 ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa; chmod 600 ~/.ssh/id_rsa
          if [[ "$PORT" != "22" ]]; then
            ssh-keyscan -p "$PORT" -t rsa,ecdsa,ed25519 "$SSH_HOST" | awk -v h="$SSH_HOST" -v p="$PORT" '{ $1 = "["h"]:"p; print }' >> ~/.ssh/known_hosts 2>/dev/null || true
          else
            ssh-keyscan -p "$PORT" -t rsa,ecdsa,ed25519 "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          fi
          chmod 644 ~/.ssh/known_hosts || true
          SSH_OPTS="-i ~/.ssh/id_rsa -p $PORT -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts -o BatchMode=yes -o ConnectTimeout=15"
          ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" "echo 'SSH OK'" || { echo "SSH connectivity failed"; exit 1; }
          ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" "mkdir -p '$DEST_DIR'"
          rsync -avz -e "ssh $SSH_OPTS" "$SRC_DIR/" "$SSH_USER@$SSH_HOST:$DEST_DIR"
